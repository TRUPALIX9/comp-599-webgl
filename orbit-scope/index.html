<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrbitScope — Live Satellite Tracker</title>
  <meta name="description" content="Real-time 3D satellite orbit visualizer. Search satellites, scrub through time, and watch them move around Earth.">

  <!-- CesiumJS -->
  <script>window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/';</script>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>

  <!-- satellite.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.1.4/satellite.min.js"></script>

  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="app">

  <!-- ── Header ────────────────────────────────────────────────────────── -->
  <header id="header">
    <div class="header-logo">
      <div class="logo-dot"></div>
      <span class="logo-text">Orbit<em>Scope</em></span>
    </div>
    <span style="color:var(--muted);font-size:12px;letter-spacing:0.06em;text-transform:uppercase;">
      Real-time Satellite Tracker · CSUCI WebGL
    </span>
  </header>

  <!-- ── Globe Layer ───────────────────────────────────────────────────── -->
  <div id="globe-layer">

    <!-- Cesium viewport -->
    <div id="cesium-container"></div>

    <!-- Search Panel (top-left) -->
    <div id="search-panel">
      <div id="search-wrap">
        <span id="search-icon">🔍</span>
        <input
          id="search-input"
          type="text"
          placeholder="Search satellite name or NORAD ID…"
          autocomplete="off"
          spellcheck="false"
        >
      </div>
      <ul id="search-results" hidden></ul>
    </div>

    <!-- Meta Panel (top-right) — hidden until satellite selected -->
    <div id="meta-panel" hidden>
      <div class="mp-header">
        <div class="mp-sat-name" id="mp-name">—</div>
        <div class="mp-sat-sub">
          NORAD <span id="mp-id" style="color:var(--cyan)">—</span>
          &nbsp;·&nbsp;
          <span id="mp-category">—</span>
        </div>
      </div>

      <div class="mp-rows">
        <div class="mp-row">
          <span class="mp-label">Time (UTC)</span>
          <span class="mp-value" id="mp-time">—</span>
        </div>

        <div class="mp-divider"></div>

        <div class="mp-row">
          <span class="mp-label">Latitude</span>
          <span class="mp-value" id="mp-lat">—</span>
        </div>
        <div class="mp-row">
          <span class="mp-label">Longitude</span>
          <span class="mp-value" id="mp-lon">—</span>
        </div>
        <div class="mp-row">
          <span class="mp-label">Altitude</span>
          <span class="mp-value" id="mp-alt">—</span>
        </div>
        <div class="mp-row">
          <span class="mp-label">Speed</span>
          <span class="mp-value" id="mp-spd">—</span>
        </div>

        <div class="mp-divider"></div>

        <div class="mp-row">
          <span class="mp-label">Data Source</span>
          <span class="mp-value" id="mp-src">—</span>
        </div>
        <div class="mp-row">
          <span class="mp-label">TLE Fetched</span>
          <span class="mp-value" id="mp-fetched" style="font-size:11px">—</span>
        </div>
      </div>
    </div>

    <!-- Status Bar (centered, bottom of globe) -->
    <div id="status-bar-container">
      <div id="status-bar" class="status-bar status-idle">
        Search for a satellite above to begin.
      </div>
    </div>

    <!-- Quick launch chips -->
    <div id="quick-chips">
      <span class="chip-label">Quick launch:</span>
      <button class="chip" data-id="25544"  data-name="ISS (ZARYA)"           data-cat="Space Station">ISS</button>
      <button class="chip" data-id="20580"  data-name="Hubble Space Telescope" data-cat="Observatory">Hubble</button>
      <button class="chip" data-id="48274"  data-name="Tiangong Space Station" data-cat="Space Station">Tiangong</button>
      <button class="chip" data-id="37849"  data-name="Suomi NPP"              data-cat="Weather">Suomi NPP</button>
      <button class="chip" data-id="43613"  data-name="ICESat-2"               data-cat="Cryosphere">ICESat-2</button>
    </div>

  </div><!-- /globe-layer -->

  <!-- ── Timeline ──────────────────────────────────────────────────────── -->
  <div id="timeline-container"></div>

</div><!-- /app -->

<!-- Quick-launch chip styles (inline to keep CSS file clean) -->
<style>
  #quick-chips {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 50;
  }
  .chip-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-right: 4px;
  }
  .chip {
    background: rgba(12,18,32,0.88);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background 120ms, border-color 120ms, color 120ms;
  }
  .chip:hover {
    background: rgba(0,212,255,0.14);
    border-color: var(--cyan);
    color: var(--cyan);
  }
</style>

<script type="module" src="src/app.js"></script>

<!-- Wire quick-launch chips after module loads -->
<script type="module">
  import { fetchTLE } from './src/api/celestrak.js';
  import { parseTLE, propagate, sampleFullOrbit, speedKmS } from './src/lib/propagation.js';
  import { initViewer, updateSatelliteMarker, updateOrbitPath, updateGroundTrack, clearOrbitEntities, flyToSatellite } from './src/lib/cesiumHelpers.js';
  import { state } from './src/state/AppState.js';

  // Wait for DOM + CesiumJS ready
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const sat = { id: +btn.dataset.id, name: btn.dataset.name, category: btn.dataset.cat };
        // Trigger same flow as search selection via a custom event
        document.dispatchEvent(new CustomEvent('orbitscope:select', { detail: sat }));
      });
    });
  });
</script>
</body>
</html>
